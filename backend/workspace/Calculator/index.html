<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      :root {
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --accent: #007aff;
        --accent-hover: #0066d6;
        --bg: #ffffff;
        --surface: #f2f2f7;
        --border: #d1d1d6;
        --text: #1d1d1f;
        --text-secondary: #6e6e73;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font);
        color: var(--text);
        background: #e8e8ed;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .window {
        background: var(--bg);
        border-radius: 12px;
        box-shadow:
            0 0 0 0.5px rgba(0,0,0,0.12),
            0 20px 60px rgba(0,0,0,0.25),
            0 8px 20px rgba(0,0,0,0.1);
        width: fit-content;
        min-width: 320px;
        max-width: 600px;
        min-height: 360px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .dot { width: 12px; height: 12px; border-radius: 50%; }
      .dot-red { background: #ff5f57; }
      .dot-yellow { background: #febc2e; }
      .dot-green { background: #28c840; }
      .titlebar-title {
        flex: 1;
        text-align: center;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .window-content { padding: 20px; }
<style>body { display: flex; flex-direction: column; align-items: center; padding: 0; margin: 0; font-family: var(--font); } .calculator { display: flex; flex-direction: column; align-items: center; padding: 24px; width: 300px; background: var(--surface); border-radius: var(--radius); } .display { text-align: right; padding: 12px 4px 24px; } .display-expression { font-size: 14px; color: var(--text-secondary); min-height: 20px; } .display-current { font-size: 56px; font-weight: 200; color: var(--text); line-height: 1; } .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 8px; } .btn { aspect-ratio: 1; border-radius: 50%; border: none; cursor: pointer; font-size: 20px; font-family: var(--font); transition: all 0.15s ease; width: 100%; } .btn:active { transform: scale(0.92); opacity: 0.8; } .btn-secondary { background: #e0e0e5; color: var(--text); } .btn-secondary:hover { background: #d0d0d5; } .btn-dark { background: #888; color: white; } .btn-dark:hover { background: #777; } .btn-accent { background: var(--accent); color: white; } .btn-accent:hover { background: var(--accent-hover); }</style>
    </style>
  </head>
  <body>
    <div class="window">
      <div class="titlebar">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <div class="titlebar-title">Calculator</div>
      </div>
      <div class="window-content">
<div class='window-content'><div class='calculator'><div class='display'><div class='display-expression' id='expression'></div><div class='display-current' id='current'>0</div></div><div class='buttons'><button class='btn btn-secondary' onclick="clearAll()">C</button><button class='btn btn-secondary' onclick="toggleSign()">+/-</button><button class='btn btn-secondary' onclick="percentage()">%</button><button class='btn btn-accent' onclick="inputOp('/')">÷</button><button class='btn btn-secondary' onclick="inputNum(7)">7</button><button class='btn btn-secondary' onclick="inputNum(8)">8</button><button class='btn btn-secondary' onclick="inputNum(9)">9</button><button class='btn btn-accent' onclick="inputOp('*')">×</button><button class='btn btn-secondary' onclick="inputNum(4)">4</button><button class='btn btn-secondary' onclick="inputNum(5)">5</button><button class='btn btn-secondary' onclick="inputNum(6)">6</button><button class='btn btn-accent' onclick="inputOp('-')">-</button><button class='btn btn-secondary' onclick="inputNum(1)">1</button><button class='btn btn-secondary' onclick="inputNum(2)">2</button><button class='btn btn-secondary' onclick="inputNum(3)">3</button><button class='btn btn-accent' onclick="inputOp('+')">+</button><button class='btn btn-secondary' onclick="inputNum(0)">0</button><button class='btn btn-secondary' onclick="inputNum('.')">.</button><button class='btn btn-accent' onclick="calculate()">=</button></div></div></div>
      </div>
    </div>
    <script>
let current = '0'; let expression = ''; let shouldReset = false; function updateDisplay() { document.getElementById('current').textContent = current; document.getElementById('expression').textContent = expression; } function inputNum(n) { if (shouldReset) { current = n; shouldReset = false; } else { current = current === '0' ? n : current + n; } updateDisplay(); } function inputOp(op) { expression = current + ' ' + op; shouldReset = true; updateDisplay(); } function calculate() { if (!expression) return; try { let result = eval(expression + ' ' + current); current = String(parseFloat(result.toFixed(10))); expression = ''; shouldReset = true; updateDisplay(); } catch(e) { current = 'Error'; updateDisplay(); } } function clearAll() { current = '0'; expression = ''; shouldReset = false; updateDisplay(); } function toggleSign() { current = String(-parseFloat(current)); updateDisplay(); } function percentage() { current = String(parseFloat(current) / 100); updateDisplay(); }
    </script>
  </body>
</html>
